name: Site shell CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/initial-site-shell

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test React and Webflow adapters
        run: npm test

      - name: Verify package contents
        run: npm run pack:check
